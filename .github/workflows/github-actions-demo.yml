name: Github Actions Demo

run-name: ${{ github.actor}} esta ejecutando un pipeline
on: [push]
jobs:
  Saludar-Hello-World:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Este job ha sido ejecutado ${{github.event_name}}"

      - name: Mostrar repositorio y rama
        run: echo "La rama es ${{github.ref}} y el repositorio es ${{github.repository}}"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Listar los archivos del repositorio
        run: |
          ls -la
          ls backend/functions
          ls infra

        
